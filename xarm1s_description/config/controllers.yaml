controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


arm_controller:
  ros__parameters:
    joints:
      - xarm_2_joint
      - xarm_3_joint
      - xarm_4_joint
      - xarm_5_joint
      - xarm_6_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false


gripper_controller:
  ros__parameters:
    joints:
      - gripper_left_finger_joint
      - gripper_right_finger_joint
    # EFFORT command interface: the controller closes the position loop with a
    # PID and outputs torque, so the finger applies a bounded force on contact
    # (a soft squeeze) instead of teleporting to the commanded angle THROUGH the
    # object. The 0.6 s trajectory ramp keeps the position error -- and thus the
    # commanded effort -- small, so the close is gentle (no slam/fling).
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      gripper_left_finger_joint:  {p: 8.0, i: 0.0, d: 0.3, i_clamp: 0.0, ff_velocity_scale: 0.0}
      gripper_right_finger_joint: {p: 8.0, i: 0.0, d: 0.3, i_clamp: 0.0, ff_velocity_scale: 0.0}
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
