<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 628" width="880" height="628" role="img" aria-labelledby="t d">
<title id="t">Top-down reach plan for a 16 centimetre chessboard</title>
<desc id="d">Computed with the project's inverse kinematics and table-to-arm calibration. All 64 square centres are reachable. 46 allow an approach of at least 85 degrees, and 22 sit inside the 20 centimetre radius where the visual servo is reliable today.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d68; --grid:#e1e0d9; --axis:#c3c2b7;
        --band:#f1f0ea; --s1:#2a78d6; --s2:#eb6834; --s3:#898781; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#a3a198; --grid:#2c2c2a; --axis:#383835;
          --band:#262624; --s1:#3987e5; --s2:#d95926; --s3:#898781; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .h1 { font-size:18px; font-weight:600; fill:var(--ink); }
  .sub { font-size:13px; fill:var(--ink2); }
  .ptitle { font-size:14px; font-weight:600; fill:var(--ink); }
  .row { font-size:13px; font-weight:600; fill:var(--ink); }
  .tick { font-size:12px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .val { font-size:12.5px; font-weight:600; fill:var(--ink); }
  .note { font-size:12.5px; fill:var(--ink2); }
</style>
<rect width="880" height="628" rx="8" fill="var(--surface)"/>
<text class="h1" x="20" y="31">A 16 cm board fits the arm’s reach. The visual servo does not cover it yet.</text>
<text class="sub" x="20" y="52">Top-down plan from the project’s own IK and calibration: all 64 square centres are reachable, but only 22 lie inside today’s reliable servo radius.</text>
