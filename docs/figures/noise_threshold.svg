<text class="h1" x="20" y="31">Measured noise barely registers. Accuracy holds to ×10 and breaks at ×20.</text>
<text class="sub" x="20" y="52">Simulated depth with the measured ToF noise model, axial term scaled from ×1 (measured) to ×20. Scene and placements are identical across conditions.</text>
<text class="row" x="20" y="82">Planar pose error (RMSE, mm). Lower is better.</text>
